name: Verify Časovač
on:
  push:
    branches: [main, refactor/audit-cleanup-20261105]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PID builder with synthetic GTFS
        run: python -m unittest discover -s tests -p 'test_pid_*.py' -v
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Typecheck and bundle
        run: npm run build
