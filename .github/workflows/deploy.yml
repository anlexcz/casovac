name: Deploy Časovač
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify UTC GTFS update day
        id: gtfs-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore today's GTFS lookup
        id: gtfs-cache
        uses: actions/cache@v4
        with:
          path: public/data
          key: casovac-gtfs-v1-${{ steps.gtfs-day.outputs.day }}
          restore-keys: |
            casovac-gtfs-v1-
      - name: Build PID GTFS lookup when today's cache is unavailable
        if: steps.gtfs-cache.outputs.cache-hit != 'true'
        run: python scripts/build_gtfs_lookup.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify compiled site and GTFS files
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s dist/data/stops.json
          test -s dist/data/tram-trip-first-stops.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
