name: Deploy Časovač
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify Prague GTFS update day
        id: gtfs-day
        run: echo "day=$(TZ=Europe/Prague date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore today's GTFS lookup
        id: gtfs-cache
        uses: actions/cache@v4
        with:
          path: |
            public/data/stops.json
            public/data/tram-trip-first-stops.json
          key: casovac-gtfs-lookup-v2-${{ steps.gtfs-day.outputs.day }}
      - name: Build PID GTFS lookup when today's cache is unavailable
        if: steps.gtfs-cache.outputs.cache-hit != 'true'
        run: python scripts/build_gtfs_lookup.py
      - name: Test PID builder with synthetic GTFS
        run: python -m unittest discover -s tests -p 'test_pid_builder.py' -v
      - name: Build static PID data for Prague service days -1/0/+1
        run: python scripts/build_pid_data.py
      - name: Check PID shard sizes and integrity
        run: python scripts/check_pid_bundle.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify compiled site and GTFS files
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s dist/data/stops.json
          test -s dist/data/tram-trip-first-stops.json
          test -s dist/data/pid/v1/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base = Path('dist/data/pid/v1')
          manifest = json.loads((base/'manifest.json').read_text())
          today = datetime.now(ZoneInfo('Europe/Prague')).date().isoformat()
          assert manifest['schema'] == 'casovac-pid-v1'
          assert manifest['referenceDay'] == today, (manifest['referenceDay'], today)
          assert manifest['days'][today]['trips'] > 100
          assert (base/'days'/today/'trips.json').stat().st_size > 1000
          assert (base/'stops/gtfs-map.json').stat().st_size > 1000
          print('Validated PID manifest for', today)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
