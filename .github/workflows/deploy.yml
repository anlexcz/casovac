name: Deploy Časovač
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build daily PID GTFS lookup (static assets)
        run: python scripts/build_gtfs_lookup.py
      - run: npm install --no-audit --no-fund
      - name: Verify chained-line handoff rules
        run: npm test
      - run: npm run build
      - name: Verify compiled site
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s dist/data/stops.json
          test -s dist/data/tram-trip-first-stops.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
